# Expected vars:
# The following vars must be set at the repo level.
#
#   AWS_ACCOUNT_ID: 123456789012
#   AWS_ROLE_REGION: us-east-1
#   AWS_ROLE_NAME: deploy-role
#   ECR_REPO_NAME: repo

name: Publish mongodbtools-aws

on:
  workflow_dispatch:
  push:
    tags:
      - 'mongodbtools-aws-*' # e.g mongodbtools-aws-100-20-1-trixie

env:
  IMAGE_NAME: mongodbtools-aws
  ECR_REGISTRY_URL: public.ecr.aws

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7

      - name: Git Commit - set IMAGE_TAG
        run: echo "IMAGE_TAG=$(echo ${{ github.ref_name}} | sed 's/mongodbtools-aws-//')" >> $GITHUB_ENV

      - name: Get environment for build job
        run: echo "${{ env.IMAGE_TAG }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_ROLE_REGION }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.IMAGE_NAME }}
          file: ${{ env.IMAGE_NAME }}/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY_URL }}/${{ vars.ECR_REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          sbom: false
          provenance: false
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build
